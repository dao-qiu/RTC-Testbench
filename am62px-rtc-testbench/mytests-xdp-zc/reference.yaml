---
#
# XDP Zero-Copy performance test — AM62Px (reference node)
#
# Runs on AM62Px, eth1 (CPSW3G, XDP zero-copy port)
# AM62Px IP : 172.168.1.22
# Host PC IP: 172.168.1.1
#
# Before running:
#   1. Fill in TsnHighDestination with host PC enp3s0 MAC address
#   2. Ensure xdp_kern_profinet_vid100.o is at /usr/local/lib/rtc-testbench/ebpf/
#   3. Run: chrt -f 90 reference -c reference.yaml
#
Application:
  ApplicationClockId: CLOCK_TAI
  ApplicationBaseCycleTimeNS: 1ms
  ApplicationTxBaseOffsetNS: 800us
  ApplicationRxBaseOffsetNS: 300us
  ApplicationXdpProgram: xdp_kern_profinet_vid100.o
TSNHigh:
  TsnHighEnabled: true
  TsnHighXdpEnabled: true
  TsnHighXdpSkbMode: false
  TsnHighXdpZcMode: true          # XDP zero-copy — CPSW3G eth1 supports this
  TsnHighXdpWakeupMode: true
  TsnHighTxTimeEnabled: false
  TsnHighTxTimeOffsetNS: 0
  TsnHighTxTimeStampEnabled: false
  TsnHighVid: 100
  TsnHighNumFramesPerCycle: 1
  TsnHighPayloadPattern: |
    TsnHighPayloadPattern
  TsnHighFrameLength: 128
  TsnHighRxQueue: 0               # eth1 RX traffic → Flow 0
  TsnHighTxQueue: 0
  TsnHighSocketPriority: 7
  TsnHighTxThreadPriority: 98
  TsnHighRxThreadPriority: 98
  TsnHighTxThreadCpu: 3           # isolated core (isolcpus=3)
  TsnHighRxThreadCpu: 3           # isolated core (isolcpus=3)
  TsnHighInterface: eth1
  TsnHighDestination: <host-pc-enp3s0-MAC>
TSNLow:
  TsnLowEnabled: false
  TsnLowXdpEnabled: true
  TsnLowXdpSkbMode: false
  TsnLowXdpZcMode: true
  TsnLowXdpWakeupMode: true
  TsnLowTxTimeEnabled: false
  TsnLowTxTimeOffsetNS: 0
  TsnLowTxTimeStampEnabled: false
  TsnLowVid: 100
  TsnLowNumFramesPerCycle: 1
  TsnLowPayloadPattern: |
    TsnLowPayloadPattern
  TsnLowFrameLength: 128
  TsnLowRxQueue: 1
  TsnLowTxQueue: 1
  TsnLowSocketPriority: 6
  TsnLowTxThreadPriority: 98
  TsnLowRxThreadPriority: 98
  TsnLowTxThreadCpu: 1
  TsnLowRxThreadCpu: 1
  TsnLowInterface: eth1
  TsnLowDestination: <host-pc-enp3s0-MAC>
RTC:
  RtcEnabled: false
  RtcXdpEnabled: true
  RtcXdpSkbMode: false
  RtcXdpZcMode: true
  RtcXdpWakeupMode: true
  RtcTxTimeStampEnabled: false
  RtcVid: 100
  RtcNumFramesPerCycle: 1
  RtcPayloadPattern: |
    RtcPayloadPattern
  RtcFrameLength: 128
  RtcRxQueue: 2
  RtcTxQueue: 2
  RtcSocketPriority: 5
  RtcTxThreadPriority: 98
  RtcRxThreadPriority: 98
  RtcTxThreadCpu: 2
  RtcRxThreadCpu: 2
  RtcInterface: eth1
  RtcDestination: <host-pc-enp3s0-MAC>
RTA:
  RtaEnabled: false
  RtaXdpEnabled: true
  RtaXdpSkbMode: false
  RtaXdpZcMode: false
  RtaXdpWakeupMode: true
  RtaTxTimeStampEnabled: false
  RtaVid: 100
  RtaBurstPeriodNS: 200ms
  RtaNumFramesPerCycle: 1
  RtaPayloadPattern: |
    RtaPayloadPattern
  RtaFrameLength: 200
  RtaRxQueue: 3
  RtaTxQueue: 3
  RtaSocketPriority: 4
  RtaTxThreadPriority: 97
  RtaRxThreadPriority: 97
  RtaTxThreadCpu: 3
  RtaRxThreadCpu: 3
  RtaInterface: eth1
  RtaDestination: <host-pc-enp3s0-MAC>
DCP:
  DcpEnabled: false
  DcpVid: 100
  DcpBurstPeriodNS: 2s
  DcpNumFramesPerCycle: 1
  DcpPayloadPattern: |
    DcpPayloadPattern
  DcpFrameLength: 200
  DcpRxQueue: 3
  DcpTxQueue: 3
  DcpSocketPriority: 3
  DcpTxThreadPriority: 53
  DcpRxThreadPriority: 53
  DcpTxThreadCpu: 4
  DcpRxThreadCpu: 4
  DcpInterface: eth1
  DcpDestination: 01:0e:cf:00:00:00
LLDP:
  LldpEnabled: false
  LldpBurstPeriodNS: 5s
  LldpNumFramesPerCycle: 1
  LldpPayloadPattern: |
    LldpPayloadPattern
  LldpFrameLength: 200
  LldpRxQueue: 3
  LldpTxQueue: 3
  LldpSocketPriority: 3
  LldpTxThreadPriority: 52
  LldpRxThreadPriority: 52
  LldpTxThreadCpu: 5
  LldpRxThreadCpu: 5
  LldpInterface: eth1
  LldpDestination: 01:80:c2:00:00:0e
UDPHigh:
  UdpHighEnabled: false
  UdpHighBurstPeriodNS: 1s
  UdpHighNumFramesPerCycle: 1
  UdpHighPayloadPattern: |
    UdpHighPayloadPattern
  UdpHighFrameLength: 1400
  UdpHighRxQueue: 3
  UdpHighTxQueue: 3
  UdpHighSocketPriority: 3
  UdpHighTxThreadPriority: 51
  UdpHighRxThreadPriority: 51
  UdpHighTxThreadCpu: 1
  UdpHighRxThreadCpu: 1
  UdpHighInterface: eth1
  UdpHighPort: 6666
  UdpHighDestination: 172.168.1.1
  UdpHighSource: 172.168.1.22
UDPLow:
  UdpLowEnabled: false
  UdpLowBurstPeriodNS: 1s
  UdpLowNumFramesPerCycle: 1
  UdpLowPayloadPattern: |
    UdpLowPayloadPattern
  UdpLowFrameLength: 1400
  UdpLowRxQueue: 3
  UdpLowTxQueue: 3
  UdpLowSocketPriority: 3
  UdpLowTxThreadPriority: 51
  UdpLowRxThreadPriority: 51
  UdpLowTxThreadCpu: 2
  UdpLowRxThreadCpu: 2
  UdpLowInterface: eth1
  UdpLowPort: 6667
  UdpLowDestination: 172.168.1.1
  UdpLowSource: 172.168.1.22
Log:
  LogThreadPriority: 1
  LogThreadCpu: 0
  LogFile: /var/log/reference_xdp_zc.log
  LogLevel: Info
Debug:
  DebugStopTraceOnOutlier: false
  DebugStopTraceOnError: false
  DebugMonitorMode: false
  DebugMonitorDestination: 44:44:44:44:44:44
